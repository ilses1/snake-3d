name: Deploy Web Demo to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署网页版到 GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 注意：仓库首次使用时，需要先在 Settings → Pages → Source
      # 手动选择 "GitHub Actions"。GITHUB_TOKEN 无权首次创建 Pages 站点
      # （会报 "Resource not accessible by integration"），开通后本步自动通过。
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 web 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
