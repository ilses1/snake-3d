name: Deploy Web Demo to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署网页版到 GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages（首次运行自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 web 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
