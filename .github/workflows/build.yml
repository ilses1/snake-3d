name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 单个平台失败不影响其他平台继续构建
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: Snake3D-Windows-x64
            args: --win --x64
          - os: ubuntu-latest
            label: Linux x64
            artifact: Snake3D-Linux-x64
            args: --linux --x64
          - os: macos-latest
            label: macOS (Intel + Apple Silicon)
            artifact: Snake3D-macOS
            args: --mac --x64 --arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装依赖
        working-directory: desktop
        run: npm ci

      - name: 同步网页版页面
        working-directory: desktop
        run: npm run sync

      - name: 打包
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 未配置证书，显式跳过 macOS 代码签名，避免构建失败
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh release-assets

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
